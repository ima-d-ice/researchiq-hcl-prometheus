[project]
name = "researchiq"
version = "0.1.0"
description = "Multimodal AI research assistant over scientific PDFs"
requires-python = ">=3.11"
dependencies = [
    "docling",
    "qdrant-client",
    "fastembed",              # BGE dense + BM25 sparse
    "sentence-transformers",  # cross-encoder reranker
    "groq",
    "pydantic>=2",
    "pydantic-settings",
    "tiktoken",
    "streamlit",
]

[project.optional-dependencies]
eval = ["ragas"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
